name: CI/CD — Production

on:
  push:
    branches: [main]

jobs:
  ci:
    name: Type Check + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --max-warnings 0

      - name: Build
        run: npm run build

  migrate:
    name: Run DB Migrations (Production)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations on production
        run: |
          supabase db push --db-url "${{ secrets.PROD_SUPABASE_DB_URL }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    name: Deploy to Production (Vercel)
    runs-on: ubuntu-latest
    needs: [ci, migrate]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  notify:
    name: Post-Deploy Notifications
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Create Sentry Release
        if: needs.deploy.result == 'success'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production

      - name: Notify on success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Production deploy successful: nuborro.com"
          # Add Slack/Discord webhook here when ready

      - name: Notify on failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Production deploy FAILED. Check logs immediately."
          # Add Slack/Discord webhook here when ready
